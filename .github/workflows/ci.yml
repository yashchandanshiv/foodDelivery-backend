name: Spring Boot CI/CD

on:
  push:
    branches:
      - devops

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build Spring Boot Project
        run: ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: yashchandanshiv/pizza-backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull yashchandanshiv/pizza-backend:latest

            docker stop pizza-backend || true
            docker rm pizza-backend || true

            docker run -d \
              --name pizza-backend \
              --restart unless-stopped \
              --env-file /home/ubuntu/.env \
              -p 8080:8080 \
              yashchandanshiv/pizza-backend:latest

            docker image prune -f
